services:
  - type: web
    name: v2labs-backend
    env: python
    plan: starter
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate && gunicorn v2_backend.wsgi:application --bind 0.0.0.0:$PORT"
    autoDeploy: true
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "your-render-service.onrender.com"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-domain.vercel.app"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://your-vercel-domain.vercel.app"
      - key: DJANGO_TIME_ZONE
        value: "Asia/Kolkata"
