<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ company_name }}{% endblock %}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f5f8;
        font-family: Arial, Helvetica, sans-serif;
        color: #0f172a;
      }
      .page {
        width: 100%;
        background-color: #f3f5f8;
        padding: 32px 16px;
      }
      .shell {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
      }
      .hero {
        background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
        border-radius: 28px 28px 0 0;
        padding: 32px;
      }
      .card {
        background-color: #ffffff;
        border-radius: 0 0 28px 28px;
        padding: 32px;
        border: 1px solid #e2e8f0;
        border-top: 0;
      }
      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background-color: rgba(255, 255, 255, 0.12);
        color: #e2e8f0;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .headline {
        margin: 18px 0 10px;
        color: #ffffff;
        font-size: 30px;
        line-height: 1.15;
        font-weight: 700;
      }
      .subcopy {
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.7;
        margin: 0;
      }
      .section-title {
        margin: 0 0 16px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #475569;
      }
      .grid {
        width: 100%;
      }
      .panel {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 22px;
        padding: 18px;
      }
      .panel-dark {
        background-color: #0f172a;
        border-radius: 22px;
        padding: 20px;
        color: #ffffff;
      }
      .label {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #64748b;
      }
      .value {
        margin: 0;
        font-size: 16px;
        line-height: 1.65;
        color: #0f172a;
        font-weight: 600;
      }
      .divider {
        height: 1px;
        background-color: #e2e8f0;
        margin: 28px 0;
      }
      .button {
        display: inline-block;
        padding: 14px 20px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        margin-right: 12px;
        margin-bottom: 12px;
      }
      .button-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff !important;
      }
      .button-secondary {
        background-color: #e2e8f0;
        color: #0f172a !important;
      }
      .footer {
        padding: 18px 8px 0;
        text-align: center;
        color: #64748b;
        font-size: 12px;
        line-height: 1.7;
      }
      @media only screen and (max-width: 640px) {
        .hero,
        .card {
          padding: 24px;
        }
        .headline {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell">
        {% block content %}{% endblock %}
        <div class="footer">
          <div>{{ company_name }} lead notifications</div>
          <div>Built for fast, premium lead response workflows.</div>
        </div>
      </div>
    </div>
  </body>
</html>
